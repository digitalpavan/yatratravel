<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Preview · Yatra Travels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap">
  <link rel="stylesheet" href="tokens/tokens.css">
  <link rel="stylesheet" href="components.css">
  <style>
    body { background: #E9E5DC; }
    .bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--gutter); background: var(--color-navy-900); color: #fff; }
    .bar a.back { color: var(--text-muted-on-inverse); font-size: var(--text-sm); }
    .bar .chips .chip { min-height: 36px; background: transparent; color: #fff; border-color: rgba(255, 255, 255, .35); }
    .bar .chips .chip[aria-pressed="true"] { background: var(--color-gold-500); color: var(--color-navy-900); border-color: var(--color-gold-500); }
    .bar :focus-visible { outline-color: var(--focus-ring-inverse); }
    .devices { display: flex; gap: var(--space-6); align-items: start; padding: var(--space-6) var(--gutter); overflow-x: auto; }
    .device { flex: none; display: grid; gap: var(--space-2); }
    .device__label { font-size: var(--text-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted-on-page); }
    .device__frame { overflow: hidden; border-radius: 14px; background: #fff; box-shadow: var(--shadow-lg); border: 6px solid var(--color-navy-900); }
    .device iframe { display: block; border: 0; transform-origin: 0 0; }
  </style>
</head>
<body>
  <div class="bar">
    <a class="back" href="index.html">← Design system</a>
    <div class="chips" role="group" aria-label="Screen" id="screen-chips"></div>
  </div>
  <main class="devices" id="devices" aria-label="Device previews"></main>
  <script src="assets/site.js"></script>
  <script>
    const screens = { home: 'Homepage', packages: 'Listing', package: 'Details', booking: 'Booking', confirmation: 'Confirmation', admin: 'Admin' };
    const devices = [
      { name: 'Desktop', w: 1440, h: 900, scale: 0.5 },
      { name: 'Tablet', w: 768, h: 1024, scale: 0.5 },
      { name: 'Mobile', w: 375, h: 812, scale: 0.75 },
    ];
    const current = new URLSearchParams(location.search).get('s') in screens ? new URLSearchParams(location.search).get('s') : 'home';
    document.getElementById('screen-chips').innerHTML = Object.entries(screens).map(([k, v]) =>
      `<a class="chip" href="?s=${k}" aria-pressed="${k === current}" ${k === current ? 'aria-current="page"' : ''}>${v}</a>`).join('');
    document.getElementById('devices').innerHTML = devices.map(d => `
      <figure class="device" style="margin:0">
        <figcaption class="device__label">${d.name} · ${d.w}px</figcaption>
        <div class="device__frame" style="width:${d.w * d.scale + 12}px;height:${d.h * d.scale + 12}px">
          <iframe src="screens/${current}.html" title="${screens[current]} at ${d.w}px" width="${d.w}" height="${d.h}" style="transform:scale(${d.scale})" loading="lazy"></iframe>
        </div>
      </figure>`).join('');
  </script>
</body>
</html>
